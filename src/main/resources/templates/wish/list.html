<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>我们的心愿清单</title>
  <style>
    *{
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
      margin: 0;
      padding: 0;
    }
    body{
      background: linear-gradient(135deg, #fff0f6, #e8f4ff);
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    .title{
      text-align:center;
      color:#dd6b99;
      font-size:28px;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    .add-box{
      background:white;
      padding:24px;
      border-radius:20px;
      box-shadow: 0 4px 15px rgba(221, 107, 153, 0.12);
      margin-bottom:24px;
    }
    .add-box form{
      display: flex;
      gap: 12px;
    }
    input[type="text"]{
      flex: 1;
      padding:12px 16px;
      border:1px solid #f5c8dd;
      border-radius:12px;
      font-size:16px;
      outline: none;
      transition: 0.2s;
    }
    input[type="text"]:focus{
      border-color:#dd6b99;
    }
    button{
      padding:12px 20px;
      border:none;
      border-radius:12px;
      color:white;
      font-size:15px;
      cursor:pointer;
      transition: 0.2s;
    }
    button:hover{
      opacity: 0.85;
      transform: translateY(-2px);
    }
    .add-btn{
      background:#dd6b99;
    }
    .wish-item{
      background:white;
      border-radius:18px;
      padding:18px;
      margin:14px 0;
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:0 3px 12px rgba(221, 107, 153, 0.08);
      transition: 0.2s;
    }
    .wish-item:hover{
      transform: translateY(-2px);
    }
    .finished-text{
      text-decoration: line-through;
      color:#b8b8b8;
    }
    .toggle-btn{
      background: #89cff0;
      width: 36px;
      height:36px;
      padding:0;
      font-size:18px;
    }
    .del-btn{
      background:#f27888;
      margin-left:auto;
    }
    .back-btn{
      background:#98a8d8;
      margin-top:30px;
      display:block;
      width: 140px;
      margin-left:auto;
      margin-right:auto;
    }
  </style>
</head>
<body>
<h2 class="title">💌 我们的心愿清单</h2>

<!-- 添加心愿表单 -->
<div class="add-box">
  <form th:action="@{/wish/add}" method="post">
    <input type="text" name="content" placeholder="写下想一起完成的小事..." required>
    <button type="submit" class="add-btn">添加心愿</button>
  </form>
</div>

<!-- 心愿列表 -->
<div th:each="wish : ${wishList}" class="wish-item">
  <form th:action="@{/wish/toggle}" method="post">
    <input type="hidden" name="id" th:value="${wish.id}">
    <button type="submit" class="toggle-btn">
      <span th:if="${wish.finished}">✅</span>
      <span th:if="!${wish.finished}">⬜</span>
    </button>
  </form>
  <span th:class="${wish.finished} ? 'finished-text' : ''" th:text="${wish.content}" style="font-size:17px;"></span>
  <form th:action="@{/wish/delete}" method="post">
    <input type="hidden" name="id" th:value="${wish.id}">
    <button type="submit" class="del-btn">删除</button>
  </form>
</div>

<a th:href="@{/}">
  <button class="back-btn">返回首页</button>
</a >
</body>
</html>
