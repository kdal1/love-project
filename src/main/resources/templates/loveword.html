<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机情话</title>
  <style>
    *{
      box-sizing: border-box;
      margin:0;
      padding:0;
      font-family: "Microsoft Yahei",sans-serif;
    }
    body{
      background:#e8f2ff;
      padding:40px 20px;
      text-align: center;
    }
    .card{
      background:#fff;
      border-radius:24px;
      padding:50px 25px;
      max-width:500px;
      margin: 0 auto;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
    }
    .heart{
      font-size:60px;
      color:#ff6688;
      margin-bottom:20px;
    }
    .title{
      font-size:22px;
      color:#444;
      margin-bottom:20px;
    }
    .msg-content{
      font-size:18px;
      line-height:2;
      color:#555;
    }
    .back{
      display:inline-block;
      margin-top:35px;
      text-decoration:none;
      background:#ff88aa;
      color:white;
      padding:12px 24px;
      border-radius:14px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="heart">💖</div>
  <div class="title" th:text="${msg.title}"></div>
  <div class="msg-content" th:text="${msg.content}"></div>
  <a th:href="@{/}" class="back">返回首页</a >
</div>
</body>
</html>
